---
# Caps on the whole app namespace: covers the frontend HPA at its maximum (5 replicas)
# plus the backend, and stops a runaway deployment from starving the node.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-quota
  namespace: app
spec:
  hard:
    pods: "15"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 2Gi
---
# At most a few build agents at a time: each pipeline run is one pod
apiVersion: v1
kind: ResourceQuota
metadata:
  name: jenkins-quota
  namespace: jenkins
spec:
  hard:
    pods: "5"
    requests.memory: 3Gi
    limits.memory: 6Gi

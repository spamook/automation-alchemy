# Defaults for any container that comes without resources (e.g. a container added by a
# tool), so nothing can run unbounded. Every manifest in this repo sets its own values.
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: app
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: registry
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: ingress
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: jenkins
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: LimitRange

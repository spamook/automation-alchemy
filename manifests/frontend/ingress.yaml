# External access: http://<minikube ip>/ -> frontend. No host rule, so the app works on the
# bare IP; the other tools are routed by path (/grafana, /kibana, /jenkins, ...).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http

# Ingress controller. The minikube "ingress" addon ships ingress-nginx, which was retired
# upstream in March 2026 (no more security fixes), so Traefik implements the Ingress API here.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  namespace: ingress
data:
  middlewares.yaml: |
    http:
      middlewares:
        # Basic auth for tools without a login of their own (Prometheus, Alertmanager).
        # The users file is mounted from the ops-basic-auth Secret (created by scripts/deploy.sh).
        ops-auth:
          basicAuth:
            usersFile: /etc/traefik/auth/users
            realm: cluster-chronicles
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ingress
  labels:
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  # hostPort 80 can only be bound by one pod at a time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: traefik
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.7.16
          args:
            - --entryPoints.web.address=:8000
            - --entryPoints.metrics.address=:8082
            - --entryPoints.traefik.address=:8080
            - --ping=true
            - --providers.kubernetesIngress=true
            - --providers.kubernetesIngress.ingressClass=traefik
            - --providers.file.directory=/etc/traefik/dynamic
            - --providers.file.watch=true
            - --metrics.prometheus=true
            - --metrics.prometheus.entryPoint=metrics
            - --accessLog=true
            - --accessLog.format=json
            - --log.level=INFO
            - --log.format=json
            - --global.checkNewVersion=false
            - --global.sendAnonymousUsage=false
          ports:
            # the node's port 80 is forwarded to Traefik: http://<minikube ip>/ reaches it
            - name: web
              containerPort: 8000
              hostPort: 80
            - name: metrics
              containerPort: 8082
            - name: admin
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /ping, port: admin }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: dynamic
              mountPath: /etc/traefik/dynamic
              readOnly: true
            - name: auth
              mountPath: /etc/traefik/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dynamic
          configMap:
            name: traefik-dynamic
        - name: auth
          secret:
            secretName: ops-basic-auth
        - name: tmp
          emptyDir: {}
---
# In-cluster entry point for the ingress (handy for testing routes from a pod)
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: ingress
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web

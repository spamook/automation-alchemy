apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana.yaml

configMapGenerator:
  - name: grafana-datasources
    namespace: monitoring
    files:
      - datasources.yaml
  - name: grafana-dashboard-provider
    namespace: monitoring
    files:
      - dashboards.yaml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/cluster-performance.json
      - dashboards/pods-containers.json
      - dashboards/app-performance.json

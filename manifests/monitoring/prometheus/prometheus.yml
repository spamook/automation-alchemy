# Prometheus pulls metrics: every 15s it scrapes each target found through the
# Kubernetes API (service discovery), so new pods and nodes show up without edits here.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: minikube

alerting:
  alertmanagers:
    - path_prefix: /alertmanager
      static_configs:
        - targets: ["alertmanager.monitoring.svc:9093"]

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # Kubernetes API server; its "up" series drives the KubeAPIServerDown alert
  - job_name: apiserver
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [default]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
        regex: kubernetes;https
        action: keep
    # the API server exposes thousands of series; keep the ones the dashboards use
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: apiserver_request_total|apiserver_current_inflight_requests|process_cpu_seconds_total|process_resident_memory_bytes
        action: keep

  # kubelet: running pods/containers, volume usage
  - job_name: kubelet
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      # the kubelet serves a self-signed certificate
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: kubelet_running_pods|kubelet_running_containers|kubelet_volume_stats_.+
        action: keep

  # cAdvisor (built into the kubelet): CPU, memory and network of every container
  - job_name: cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|cpu_cfs_periods_total|cpu_cfs_throttled_periods_total|memory_working_set_bytes|spec_memory_limit_bytes|network_(receive|transmit)_(bytes|errors)_total|oom_events_total)
        action: keep

  # node-exporter (DaemonSet on the host network): host CPU, memory, disk, network
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [monitoring]
        selectors:
          - role: pod
            label: app.kubernetes.io/name=node-exporter
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # kube-state-metrics: the state of Kubernetes objects (pod phase, restarts, limits, ...).
  # honor_labels keeps namespace/pod of the described objects instead of the exporter's own.
  - job_name: kube-state-metrics
    honor_labels: true
    static_configs:
      - targets: ["kube-state-metrics.monitoring.svc:8080"]

  # any pod annotated with prometheus.io/scrape: "true" (backend, traefik, fluent-bit, ...)
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Pending|Succeeded|Failed
        action: drop
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # job = the app's name, so queries read up{job="backend"}
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: job
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

# The script comes from a ConfigMap, so a stock Python image is enough: no build step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-receiver
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-receiver
          image: python:3.14.10-alpine3.24
          command: [python, -u, /app/receiver.py]
          env:
            # empty unless ALERT_WEBHOOK_URL is set in .secrets/credentials.env
            - name: FORWARD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alert-webhook
                  key: url
                  optional: true
          ports:
            - name: http
              containerPort: 9095
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: alert-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: alert-receiver
  ports:
    - name: http
      port: 9095
      targetPort: http

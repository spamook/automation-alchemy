# Read access to pods and namespaces (metadata for log lines) and events (event input)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
---
# One collector per node. It runs as root only to read the node's log files (owned by
# root); it has no capabilities, a read-only filesystem and read-only log mounts.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2020"
        prometheus.io/path: /api/v2/metrics/prometheus
    spec:
      serviceAccountName: fluent-bit
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          args: [--config=/fluent-bit/config/fluent-bit.yaml]
          env:
            - name: FLUENTBIT_ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: fluentbit-password
          ports:
            - name: http
              containerPort: 2020
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 48Mi }
            limits: { cpu: 300m, memory: 128Mi }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/config
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: journal
              mountPath: /run/log/journal
              readOnly: true
            # read positions: a restarted pod continues where it stopped
            - name: state
              mountPath: /var/fluent-bit/state
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath: { path: /var/log }
        - name: journal
          hostPath: { path: /run/log/journal }
        - name: state
          hostPath: { path: /var/lib/fluent-bit, type: DirectoryOrCreate }

# Translates Elasticsearch cluster health into Prometheus metrics
# (elasticsearch_cluster_health_status{color="green|yellow|red"}) for the ES alerts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: logging
  labels:
    app.kubernetes.io/name: elasticsearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9114"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.11.0
          args:
            - --es.uri=http://elasticsearch.logging.svc.cluster.local:9200
            - --es.timeout=10s
          env:
            # the read-only es-exporter user created by the elasticsearch-setup Job
            - name: ES_USERNAME
              value: es-exporter
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef: { name: elasticsearch-credentials, key: exporter-password }
          ports:
            - name: metrics
              containerPort: 9114
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 15
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

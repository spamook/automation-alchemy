# Private image registry inside the cluster: Jenkins pushes the images it builds here,
# the node pulls them from here when a deployment rolls out.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  storageClassName: local-storage
  volumeName: registry-data
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  # the volume is ReadWriteOnce: stop the old pod before a new one mounts it
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3.1.2
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # tracing is on by default in registry v3, there is no collector to send it to
            - name: OTEL_TRACES_EXPORTER
              value: none
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet: { path: /v2/, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v2/, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  # Fixed ClusterIP: the node's container runtime pulls images by this address because it
  # can't resolve cluster DNS names. Port 80 keeps image names short: 10.96.0.50/backend:tag
  clusterIP: 10.96.0.50
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 80
      targetPort: http

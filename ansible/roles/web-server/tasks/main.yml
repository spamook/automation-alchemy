---
- name: Allow port 80 from load balancer
  ufw:
    rule: allow
    src: '192.168.56.10'
    port: '80'
    proto: tcp

- name: Allow port 3001 from load balancer and monitoring-server (metrics sidecar)
  ufw:
    rule: allow
    src: "{{ item }}"
    port: '3001'
    proto: tcp
  loop:
    - '192.168.56.10'
    - '192.168.56.16'

- name: Create .env file with backend host
  copy:
    dest: /vagrant/.env
    content: "BACKEND_HOST=192.168.56.13\n"
    owner: devops
    group: devops

# frontend and sidecar are in the same compose project ("vagrant"), so no --remove-orphans:
# it would delete the other one's container as an "orphan"
- name: Deploy frontend container
  become_user: devops
  shell: |
    docker compose -f docker-compose.frontend.yml down 2>/dev/null || true
    docker compose -f docker-compose.frontend.yml up -d --build
  args:
    chdir: /vagrant

- name: Deploy metrics sidecar container
  become_user: devops
  shell: |
    docker compose -f docker-compose.sidecar.yml down 2>/dev/null || true
    docker compose -f docker-compose.sidecar.yml up -d --build
  args:
    chdir: /vagrant
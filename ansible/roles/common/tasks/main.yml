
---
# The VMs are small (512-768 MB): Docker image builds / JVMs need room for peaks.
# With swap they slow down instead of getting OOM-killed.
- name: Create 1 GB swap file
  command: fallocate -l 1G /swapfile
  args:
    creates: /swapfile
  register: swap_file

- name: Restrict swap file permissions
  file:
    path: /swapfile
    mode: '0600'

- name: Format and enable swap
  shell: mkswap /swapfile && swapon /swapfile
  when: swap_file.changed

- name: Enable swap on boot
  lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'

# Use swap only under real memory pressure (default 60 swaps much earlier)
- name: Prefer RAM over swap
  sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    reload: yes

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - git
      - ufw
      - sshguard
      - python3
      - rsync
      - acl
      # tools for the alert tests (CPU/memory load, ifconfig)
      - stress-ng
      - net-tools
    state: present

- name: Create devops group
  group:
    name: devops
    state: present

- name: Create devops user
  user:
    name: devops
    groups: devops,sudo
    shell: /bin/bash
    create_home: yes
    state: present

- name: Set devops account password (required to demonstrate password-protected sudo)
  ansible.builtin.shell: "echo 'devops:{{ devops_password }}' | chpasswd"
  changed_when: true

- name: Create .ssh directory for devops
  file:
    path: /home/devops/.ssh
    state: directory
    owner: devops
    group: devops
    mode: '0700'

- name: Add Jenkins deploy key to devops authorized_keys
  authorized_key:
    user: devops
    key: "{{ lookup('file', '/vagrant/ansible/files/jenkins_key.pub') }}"
    state: present

- name: Disable SSH password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: restart sshd

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: restart sshd

- name: Enable UFW with default deny
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Add all VM hostnames to /etc/hosts
  blockinfile:
    path: /etc/hosts
    block: |
      192.168.56.10 load-balancer
      192.168.56.11 web-server-1
      192.168.56.12 web-server-2
      192.168.56.13 app-server
      192.168.56.14 backup-server
      192.168.56.15 ci-server
      192.168.56.16 monitoring-server

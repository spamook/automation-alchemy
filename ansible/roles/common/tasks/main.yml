
---
# Swap comes first: on the 512-768 MB VMs the first apt run (plus unattended-upgrades,
# which starts at boot when a VM was off for a while) can exhaust the memory otherwise.
# Docker image builds / JVMs need room for peaks: with swap they slow down instead of
# getting OOM-killed.
- name: Create 1 GB swap file
  command: fallocate -l 1G /swapfile
  args:
    creates: /swapfile
  register: swap_file

- name: Restrict swap file permissions
  file:
    path: /swapfile
    mode: '0600'

- name: Format and enable swap
  shell: mkswap /swapfile && swapon /swapfile
  when: swap_file.changed

- name: Enable swap on boot
  lineinfile:
    path: /etc/fstab
    line: '/swapfile none swap sw 0 0'

# Use swap only under real memory pressure (default 60 swaps much earlier)
- name: Prefer RAM over swap
  sysctl:
    name: vm.swappiness
    value: '10'
    state: present
    reload: yes

# A VM that was powered off for a while starts unattended-upgrades right after boot.
# On the small VMs that run can take an hour and holds the dpkg lock the whole time.
# Pause it (it runs again with the next daily timer, security updates stay enabled)...
- name: Pause automatic upgrades running right now
  shell:
    cmd: |
      systemctl stop apt-daily.service apt-daily-upgrade.service || true
      # the services use KillMode=process, so the stop above does not reach unattended-upgrade
      # itself; on SIGTERM it finishes the current package and exits (same as on shutdown)
      pkill -TERM -f "^/usr/bin/python3 /usr/bin/unattended-upgrade" || true
  changed_when: false

# ...make every apt-get call (also Ansible's) wait for the lock instead of failing,
# in case a timer starts it again in the middle of the play...
- name: Let apt wait for the dpkg lock instead of failing
  copy:
    dest: /etc/apt/apt.conf.d/90lock-timeout
    content: 'DPkg::Lock::Timeout "900";'
    mode: '0644'

# ...and finish a package install that was interrupted (stopped upgrade or a VM that was
# powered off mid-upgrade), otherwise dpkg refuses to install anything
- name: Finish interrupted package installs
  command: dpkg --configure -a
  changed_when: false
  # dpkg itself doesn't wait for the lock: retry while a stopped upgrade winds down
  register: dpkg_configure
  until: dpkg_configure.rc == 0
  retries: 60
  delay: 10

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
    lock_timeout: 600

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - git
      - ufw
      - sshguard
      - python3
      - rsync
      - acl
      # tools for the alert tests (CPU/memory load, ifconfig)
      - stress-ng
      - net-tools
    state: present
    lock_timeout: 600

- name: Create devops group
  group:
    name: devops
    state: present

- name: Create devops user
  user:
    name: devops
    groups: devops,sudo
    shell: /bin/bash
    create_home: yes
    state: present

- name: Set devops account password (required to demonstrate password-protected sudo)
  ansible.builtin.shell: "echo 'devops:{{ devops_password }}' | chpasswd"
  changed_when: true

- name: Create .ssh directory for devops
  file:
    path: /home/devops/.ssh
    state: directory
    owner: devops
    group: devops
    mode: '0700'

- name: Add Jenkins deploy key to devops authorized_keys
  authorized_key:
    user: devops
    key: "{{ lookup('file', '/vagrant/ansible/files/jenkins_key.pub') }}"
    state: present

- name: Disable SSH password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: restart sshd

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: restart sshd

- name: Enable UFW with default deny
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Add all VM hostnames to /etc/hosts
  blockinfile:
    path: /etc/hosts
    block: |
      192.168.56.10 load-balancer
      192.168.56.11 web-server-1
      192.168.56.12 web-server-2
      192.168.56.13 app-server
      192.168.56.14 backup-server
      192.168.56.15 ci-server
      192.168.56.16 monitoring-server

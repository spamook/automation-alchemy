
---
- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - git
      - ufw
      - sshguard
      - python3
      - rsync
      - acl
    state: present

- name: Create devops group
  group:
    name: devops
    state: present

- name: Create devops user
  user:
    name: devops
    groups: devops,sudo
    shell: /bin/bash
    create_home: yes
    state: present

- name: Set devops account password (required to demonstrate password-protected sudo)
  ansible.builtin.shell: "echo 'devops:{{ devops_password }}' | chpasswd"
  changed_when: true

- name: Create .ssh directory for devops
  file:
    path: /home/devops/.ssh
    state: directory
    owner: devops
    group: devops
    mode: '0700'

- name: Add Jenkins deploy key to devops authorized_keys
  authorized_key:
    user: devops
    key: "{{ lookup('file', '/vagrant/ansible/files/jenkins_key.pub') }}"
    state: present

- name: Disable SSH password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: restart sshd

- name: Disable SSH root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: restart sshd

- name: Enable UFW with default deny
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Add all VM hostnames to /etc/hosts
  blockinfile:
    path: /etc/hosts
    block: |
      192.168.56.10 load-balancer
      192.168.56.11 web-server-1
      192.168.56.12 web-server-2
      192.168.56.13 app-server
      192.168.56.14 backup-server
      192.168.56.15 ci-server
---
# node-exporter (host metrics), cAdvisor (container metrics) and Filebeat (logs)
# on every VM. They run as containers, defined in monitoring/agents/docker-compose.yml.
# Jenkins redeploys the same directory in the "Deploy monitoring agents" stage.

# The agents use the host network, so UFW applies: only Prometheus may scrape them.
- name: Allow Prometheus (monitoring-server) to scrape node-exporter and cAdvisor
  ufw:
    rule: allow
    src: 192.168.56.16
    port: "{{ item }}"
    proto: tcp
  loop:
    - '9100'   # node-exporter
    - '8081'   # cAdvisor

- name: Create agents directory
  file:
    path: /home/devops/monitoring-agents
    state: directory
    owner: devops
    group: devops
    mode: '0755'

- name: Copy agents compose file and Filebeat config
  copy:
    src: /vagrant/monitoring/agents/
    dest: /home/devops/monitoring-agents/
    remote_src: yes
    owner: devops
    group: devops
    # capital X = execute bit only on directories (a plain 0644 would make the dirs unusable)
    mode: 'u=rwX,g=rX,o=rX'
  register: agent_files

# The only per-host/per-environment part of the agents config
- name: Write per-host agent settings (.env)
  copy:
    dest: /home/devops/monitoring-agents/.env
    content: |
      HOST_NAME={{ ansible_hostname }}
      ENVIRONMENT={{ monitoring_environment | default('lab') }}
      LOGSTASH_HOST={{ logstash_host | default('192.168.56.16') }}
      LOGSTASH_PORT=5044
    owner: devops
    group: devops
    mode: '0644'

- name: Start monitoring agents
  become_user: devops
  command: docker compose up -d --quiet-pull --remove-orphans
  args:
    chdir: /home/devops/monitoring-agents
  register: agents_up
  changed_when: agents_up.stderr is search('Created|Recreated|Started')

# filebeat.yml is a bind mount: compose doesn't notice its content changed
- name: Restart Filebeat to load a changed config
  become_user: devops
  command: docker compose restart filebeat
  args:
    chdir: /home/devops/monitoring-agents
  when: agent_files.changed

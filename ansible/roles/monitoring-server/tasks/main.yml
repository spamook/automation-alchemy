---
# Monitoring & logging VM: Prometheus, Grafana, Elasticsearch (2 nodes), Logstash, Kibana.
# Everything runs from monitoring/docker-compose.yml.

# Elasticsearch refuses to start with the Linux default (65530) — it needs many mmaps
- name: Raise vm.max_map_count for Elasticsearch
  sysctl:
    name: vm.max_map_count
    value: '262144'
    state: present
    reload: yes

- name: Open web UIs (Grafana, Kibana, Prometheus)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '3000'   # Grafana
    - '5601'   # Kibana
    - '9090'   # Prometheus

- name: Allow Filebeat on the VMs to ship logs to Logstash
  ufw:
    rule: allow
    src: 192.168.56.0/24
    port: '5044'
    proto: tcp

# Prometheus runs in a container: when it scrapes the agents on THIS host the packets
# come from the Docker bridge network (172.16.0.0/12), not from 192.168.56.16
- name: Allow local containers to scrape this host's node-exporter and cAdvisor
  ufw:
    rule: allow
    src: 172.16.0.0/12
    port: "{{ item }}"
    proto: tcp
  loop:
    - '9100'
    - '8081'

- name: Create monitoring directory
  file:
    path: /home/devops/monitoring
    state: directory
    owner: devops
    group: devops
    mode: '0755'

- name: Copy monitoring stack configuration
  copy:
    src: /vagrant/monitoring/
    dest: /home/devops/monitoring/
    remote_src: yes
    owner: devops
    group: devops
    # capital X = execute bit only on directories (a plain 0644 would make the dirs unusable)
    mode: 'u=rwX,g=rX,o=rX'
  register: stack_files

- name: Write monitoring stack settings (.env)
  copy:
    dest: /home/devops/monitoring/.env
    content: |
      GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password | default('admin') }}
      PROMETHEUS_RETENTION_TIME={{ prometheus_retention_time | default('30d') }}
      PROMETHEUS_RETENTION_SIZE={{ prometheus_retention_size | default('5GB') }}
      FORWARD_WEBHOOK_URL={{ alert_forward_webhook_url | default('') }}
    owner: devops
    group: devops
    mode: '0600'

# Pulls ~3 GB of images on the first run; waits until Elasticsearch is healthy
# and the index templates exist before Logstash starts (depends_on conditions)
- name: Start monitoring stack
  become_user: devops
  command: docker compose up -d --quiet-pull --remove-orphans
  args:
    chdir: /home/devops/monitoring
  register: stack_up
  changed_when: stack_up.stderr is search('Created|Recreated|Started')

# Config files are bind mounts -> apply changes without recreating containers.
# (Logstash reloads its pipeline by itself: config.reload.automatic)
- name: Reload Prometheus config
  command: curl -fsS -X POST http://localhost:9090/-/reload
  register: prom_reload
  retries: 10
  delay: 6
  until: prom_reload.rc == 0
  when: stack_files.changed

- name: Restart Grafana to re-read provisioning (datasources, alert rules)
  become_user: devops
  command: docker compose restart grafana
  args:
    chdir: /home/devops/monitoring
  when: stack_files.changed

---
# allow to work with HHTps repo
# GPG key  checker

- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
    state: present

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

# daemon.json goes in BEFORE the engine is installed, so Docker starts with it right away
# and containers deployed later in this play don't get killed by a restart at the end.
- name: Create Docker config directory
  file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configure Docker daemon (local registry + log rotation)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "insecure-registries": ["192.168.56.15:5000"],
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
  notify: restart docker

# docker-compose v1 (python) can't talk to Docker 29+ anymore (API too old),
# so we use the compose v2 plugin: "docker compose ..."
- name: Install Docker CE and compose plugin
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Add devops to docker group
  user:
    name: devops
    groups: docker
    append: yes

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Apply Docker config changes now (before containers are deployed)
  meta: flush_handlers

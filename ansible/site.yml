## main file  : who/what/get  setup

---
- name: Provision server
  hosts: all
  # sudo allow
  become: yes

  roles:
    # swap, apt cache, users / ssh/ ufw
    - common

    # docker on every VM — the monitoring agents run as containers everywhere
    - docker

    - role: app-server
      when: ansible_hostname == 'app-server'

    - role: web-server
      when: ansible_hostname in ['web-server-1', 'web-server-2']

    - role: load-balancer
      when: ansible_hostname == 'load-balancer'

    - role: backup-server
      when: ansible_hostname == 'backup-server'

    - role: ci-server
      when: ansible_hostname == 'ci-server'

    # Prometheus, Grafana, Elasticsearch, Logstash, Kibana
    - role: monitoring-server
      when: ansible_hostname == 'monitoring-server'

    # node-exporter + cAdvisor + Filebeat on every VM
    - monitoring-agents

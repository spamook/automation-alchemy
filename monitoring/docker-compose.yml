# Monitoring & logging stack — runs on monitoring-server (192.168.56.16).
#
#   Metrics: Prometheus (pull) -> Grafana (dashboards + alerts)
#   Logs:    Filebeat (on every VM) -> Logstash -> Elasticsearch (2 nodes) -> Kibana
#   Alerts:  Grafana + Logstash -> alert-receiver (webhook, can forward to Slack/Discord)
#
# Start/update:  docker compose up -d        (from /home/devops/monitoring)
name: monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------------ metrics
  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: prometheus
    restart: unless-stopped
    logging: *logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # history: keep 30 days OR 5 GB, whichever is hit first
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      # allows "curl -X POST localhost:9090/-/reload" after config changes (no restart)
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.4.12
    container_name: grafana
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vm-performance.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # datasources, dashboards, alerting
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Translates Elasticsearch cluster health into Prometheus metrics (for the yellow/red alert)
  es-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
    container_name: es-exporter
    restart: unless-stopped
    logging: *logging
    command:
      - --es.uri=http://es01:9200
      - --es.timeout=10s

  # ------------------------------------------------------------------ logs
  # Two-node Elasticsearch cluster:
  #   es01 — master + data, es02 — data only.
  # Every index has 1 replica, so each shard lives on both nodes. Stopping es02
  # leaves the replicas unassigned -> cluster health YELLOW (data still complete).
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    container_name: es01
    restart: unless-stopped
    logging: *logging
    environment:
      - node.name=es01
      - node.roles=master,data,ingest
      - cluster.name=infra-logs
      - cluster.initial_master_nodes=es01
      - discovery.seed_hosts=es02
      - ES_JAVA_OPTS=-Xms384m -Xmx384m
      # lab setup: no TLS/auth inside the private network (never do this on the internet)
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      # small lab disks: don't let disk watermarks block shard allocation / make indices read-only
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es01-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"     # only reachable from the VM itself (curl localhost:9200)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.22
    container_name: es02
    restart: unless-stopped
    logging: *logging
    environment:
      - node.name=es02
      - node.roles=data,ingest
      - cluster.name=infra-logs
      - discovery.seed_hosts=es01
      - ES_JAVA_OPTS=-Xms384m -Xmx384m
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es02-data:/usr/share/elasticsearch/data

  # One-shot job: ILM retention policies + index templates (must exist before Logstash writes)
  es-setup:
    image: curlimages/curl:8.16.0
    container_name: es-setup
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "/setup/setup.sh", "elasticsearch"]
    environment:
      - ES_URL=http://es01:9200
      - KIBANA_URL=http://kibana:5601
    volumes:
      - ./setup:/setup:ro
    depends_on:
      es01:
        condition: service_healthy

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.22
    container_name: logstash
    restart: unless-stopped
    logging: *logging
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - ALERT_WEBHOOK_URL=http://alert-receiver:9095/logstash
    volumes:
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"               # Beats input — Filebeat on every VM connects here
    depends_on:
      es-setup:
        condition: service_completed_successfully

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.22
    container_name: kibana
    restart: unless-stopped
    logging: *logging
    environment:
      - ELASTICSEARCH_HOSTS=["http://es01:9200"]
      - SERVER_PUBLICBASEURL=http://192.168.56.16:5601
      - TELEMETRY_OPTIN=false
      - NODE_OPTIONS=--max-old-space-size=512
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    depends_on:
      es01:
        condition: service_healthy

  # One-shot job: Kibana data views + the 3 log dashboards
  kibana-setup:
    image: curlimages/curl:8.16.0
    container_name: kibana-setup
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "/setup/setup.sh", "kibana"]
    environment:
      - ES_URL=http://es01:9200
      - KIBANA_URL=http://kibana:5601
    volumes:
      - ./setup:/setup:ro
    depends_on:
      kibana:
        condition: service_healthy

  # ------------------------------------------------------------------ notifications
  # Tiny webhook receiver: prints every alert (from Grafana and Logstash) and appends it to
  # /var/log/alerts/notifications.log. Set FORWARD_WEBHOOK_URL to also push to Slack/Discord.
  alert-receiver:
    image: python:3.12-alpine
    container_name: alert-receiver
    restart: unless-stopped
    logging: *logging
    command: ["python", "-u", "/app/receiver.py"]
    environment:
      - FORWARD_WEBHOOK_URL=${FORWARD_WEBHOOK_URL:-}
    volumes:
      - ./alert-receiver:/app:ro
      - alerts-data:/var/log/alerts

volumes:
  prometheus-data:
  grafana-data:
  es01-data:
  es02-data:
  alerts-data:

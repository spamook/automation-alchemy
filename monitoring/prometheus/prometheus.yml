# Prometheus — PULL model: every scrape_interval Prometheus itself connects to each
# target's /metrics endpoint and stores the samples in its time-series DB.
#
# Change how often metrics are collected: edit scrape_interval (globally below, or
# per job), then reload without restart:
#   curl -X POST http://localhost:9090/-/reload
global:
  scrape_interval: 15s        # 15s = near real-time graphs at a low cost (default is 1m)
  scrape_timeout: 10s         # must be <= scrape_interval
  evaluation_interval: 15s
  external_labels:
    environment: lab

# Targets live in targets/*.yml (file-based service discovery). Prometheus re-reads
# those files automatically every refresh_interval: adding a VM = adding 2 lines, no restart.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { host: monitoring-server }

  # node-exporter on every VM — host CPU / memory / disk / network
  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node.yml"]
        refresh_interval: 1m

  # cAdvisor on every VM — per-container metrics
  - job_name: cadvisor
    scrape_interval: 15s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/cadvisor.yml"]
        refresh_interval: 1m
    metric_relabel_configs:
      # cAdvisor also reports cgroups of systemd services; we only care about real containers
      - source_labels: [name]
        regex: ""
        action: drop

  # Our Node.js backend (app-server) and the metrics sidecars (web servers):
  # prom-client exposes them on /prometheus (/metrics is the JSON API for the load balancer)
  - job_name: backend
    metrics_path: /prometheus
    file_sd_configs:
      - files: ["/etc/prometheus/targets/backend.yml"]
        refresh_interval: 1m

  # Elasticsearch cluster health (green / yellow / red), via elasticsearch-exporter
  - job_name: elasticsearch
    static_configs:
      - targets: ["es-exporter:9114"]
        labels: { host: monitoring-server }

# Logstash pipeline
#
#   Filebeat (every VM) --5044--> [ parse + normalize ] --> Elasticsearch  infra-<type>-YYYY.MM.dd
#                                        |
#                                        +-- log pattern matches --> infra-alerts-* + webhook notification
#
# Index per log type: infra-system-*, infra-app-*, infra-docker-* (each has its own Kibana dashboard).

input {
  beats {
    port => 5044
  }
}

filter {
  # Keep the line exactly as it was received, before any parsing changes "message".
  mutate { copy => { "message" => "[event][original]" } }

  # ===========================================================================
  # 1. SYSTEM LOGS — /var/log/syslog, /var/log/auth.log and our scripts' logs
  # ===========================================================================
  if [fields][log_type] == "system" {
    # The same input contains several line formats. grok tries the patterns in order,
    # the first one that matches wins.
    grok {
      match => {
        "message" => [
          # Ubuntu 22.04 rsyslog:  "Oct  4 12:00:01 app-server sshd[812]: Invalid user bob from ..."
          "^%{SYSLOGTIMESTAMP:log_timestamp} %{SYSLOGHOST} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:log_message}$",
          # newer rsyslog (RFC 3339):  "2026-10-04T12:00:01.123456+00:00 app-server sshd[812]: ..."
          "^%{TIMESTAMP_ISO8601:log_timestamp} %{SYSLOGHOST} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]:int}\])?: %{GREEDYDATA:log_message}$",
          # our bash scripts:  "[2026-10-04 12:00:01] scores -> web1=21.4 web2=67.8"
          "^\[%{TIMESTAMP_ISO8601:log_timestamp}\] %{GREEDYDATA:log_message}$"
        ]
      }
      # Unknown format: the event is NOT dropped, it is stored with the raw message and a
      # tag, so it can be found in Kibana with:  tags : "_grokparsefailure_system"
      tag_on_failure => ["_grokparsefailure_system"]
    }

    # Script logs have no program name in the line -> take it from the file name
    # (/var/log/host/adaptive_lb.log -> adaptive_lb)
    if ![process][name] and [log][file][path] {
      grok {
        pattern_definitions => { "FILENAME" => "[^/]+" }
        match => { "[log][file][path]" => "/%{FILENAME:[process][name]}\.log$" }
        tag_on_failure => []
      }
    }

    # Use the time written in the log line as the event time (not the time Filebeat read it).
    # Syslog has no year/timezone — the VMs run in UTC, as does Logstash.
    date {
      match => ["log_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
      remove_field => ["log_timestamp"]
      tag_on_failure => ["_dateparsefailure"]
    }

    mutate { add_field => { "[@metadata][index]" => "infra-system" } }
  }

  # ===========================================================================
  # 2. DOCKER CONTAINER LOGS
  # ===========================================================================
  else if [fields][log_type] == "docker" {

    # Our Node.js backend (and its sidecar copies) logs one JSON object per line (winston)
    if [container][name] in ["infra-backend", "infra-sidecar"] {
      # Only try JSON on lines that look like JSON. Anything else (stack traces, npm
      # output) is kept as plain text and tagged instead of producing parse errors.
      if [message] =~ /^\s*\{/ {
        json {
          source => "message"
          target => "app"
          tag_on_failure => ["_jsonparsefailure"]
        }
      } else {
        mutate { add_tag => ["_not_json"] }
      }

      if [app][level] {
        # event time = time written by the app
        date {
          match => ["[app][timestamp]", "ISO8601"]
          remove_field => ["[app][timestamp]"]
          tag_on_failure => ["_dateparsefailure"]
        }
        # normalize: "INFO" / "Info" -> "info"; numbers that arrive as strings -> integers
        mutate {
          lowercase => ["[app][level]"]
          convert   => { "[app][status]" => "integer" "[app][durationMs]" => "integer" }
        }
        mutate { copy => { "[app][level]" => "[log][level]" } }

        # readable one-line message for Kibana Discover
        if [app][method] {
          mutate { replace => { "message" => "%{[app][method]} %{[app][path]} -> %{[app][status]} (%{[app][durationMs]} ms)" } }
        } else if [app][message] {
          mutate { replace => { "message" => "%{[app][message]}" } }
        }
      }
      mutate { add_field => { "[@metadata][index]" => "infra-app" } }
    } else {
      mutate { add_field => { "[@metadata][index]" => "infra-docker" } }
    }
  }

  # ===========================================================================
  # Anything else (misconfigured shipper): keep it, but separately
  # ===========================================================================
  else {
    mutate {
      add_tag   => ["_unknown_log_type"]
      add_field => { "[@metadata][index]" => "infra-unknown" }
    }
  }

  # ===========================================================================
  # 3. ALERT RULES — log patterns that should notify someone
  #    (only checked on the source they belong to, so an alert printed by another
  #     container can never trigger itself again)
  # ===========================================================================
  if [fields][log_type] == "system" {
    if [message] =~ /Invalid user|authentication failure|incorrect password attempt|Failed password|maximum authentication attempts/ {
      mutate { add_field => { "[alert][rule]" => "auth_failure" "[alert][severity]" => "warning" } }
    } else if [message] =~ /Out of memory|oom-kill|Killed process/ {
      mutate { add_field => { "[alert][rule]" => "oom_killer" "[alert][severity]" => "critical" } }
    } else if [message] =~ /BUILD #\d+ FAILED|ROLLBACK .* FAILED/ {
      mutate { add_field => { "[alert][rule]" => "ci_build_failed" "[alert][severity]" => "warning" } }
    }
  } else if [app][level] == "error" {
    mutate { add_field => { "[alert][rule]" => "app_error" "[alert][severity]" => "critical" } }
  }

  if [alert][rule] {
    # Anti-spam: a brute-force attack produces hundreds of identical lines. Notify only
    # about the FIRST match per rule+host every 5 minutes; the rest are tagged and only
    # stored (still visible in Kibana).
    throttle {
      key         => "%{[alert][rule]}-%{[host][name]}"
      after_count => 1
      period      => 300
      max_age     => 600
      add_tag     => ["alert_throttled"]
    }
  }
}

output {
  elasticsearch {
    hosts           => ["http://es01:9200", "http://es02:9200"]
    index           => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
    # index templates + ILM are created by the es-setup job, not by Logstash
    manage_template => false
    ilm_enabled     => false
    data_stream     => false
  }

  if [alert][rule] {
    # every match is stored for history (Kibana: data view "Log alerts")
    elasticsearch {
      hosts           => ["http://es01:9200", "http://es02:9200"]
      index           => "infra-alerts-%{+YYYY.MM.dd}"
      manage_template => false
      ilm_enabled     => false
      data_stream     => false
    }

    # notification (not throttled ones only)
    if "alert_throttled" not in [tags] {
      http {
        url          => "${ALERT_WEBHOOK_URL}"
        http_method  => "post"
        format       => "json"
        # never block log ingestion because the notification endpoint is down
        retry_failed => false
        mapping => {
          "source"    => "logstash"
          "rule"      => "%{[alert][rule]}"
          "severity"  => "%{[alert][severity]}"
          "host"      => "%{[host][name]}"
          "message"   => "%{message}"
          "timestamp" => "%{@timestamp}"
        }
      }
    }
  }
}

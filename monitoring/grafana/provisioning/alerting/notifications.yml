# Where Grafana sends alerts and how they are grouped / repeated.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: alert-receiver
    receivers:
      - uid: alert-receiver-webhook
        type: webhook
        settings:
          url: http://alert-receiver:9095/grafana
          httpMethod: POST

# Anti alert-fatigue settings:
#   group_by        — one notification per alert+host, not one per time series
#   group_wait      — wait a bit to batch alerts that fire together (e.g. a VM going down
#                     also makes its containers disappear)
#   group_interval  — at most one update about the same group every 5 minutes
#   repeat_interval — re-notify about a still-firing alert only every 4h (critical: 1h)
policies:
  - orgId: 1
    receiver: alert-receiver
    group_by: ["grafana_folder", "alertname", "host"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: alert-receiver
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 10s
        repeat_interval: 1h

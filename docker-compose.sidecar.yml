version: '3.9'


services:
  metrics-sidecar:
    # image name = registry tag: Jenkins pulls it, "up -d" then recreates the container
    image: 192.168.56.15:5000/backend:latest
    build:
      context: ./backend
    container_name: infra-sidecar
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001

version: '3.9'



services:
  frontend:
    # image name = registry tag: Jenkins pulls it, "up -d" then recreates the container
    image: 192.168.56.15:5000/frontend:latest
    build:
      context: ./frontend
    container_name: infra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-app-server}  # IP или hostname app-server
      - BACKEND_PORT=3001
